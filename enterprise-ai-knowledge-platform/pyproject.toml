[project]
name = "enterprise-ai-knowledge-platform"
version = "1.0.0"
description = "Enterprise AI Knowledge Platform powered by Snowflake Cortex AI"
requires-python = ">=3.10"
license = {text = "Proprietary"}

dependencies = [
    "snowflake-snowpark-python>=1.20.0",
    "snowflake-connector-python>=3.12.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
streamlit = [
    "streamlit>=1.37",
]
api = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "PT"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"
markers = [
    "unit: Unit tests (no Snowflake connection)",
    "integration: Integration tests (requires Snowflake)",
    "e2e: End-to-end tests (full pipeline)",
]
