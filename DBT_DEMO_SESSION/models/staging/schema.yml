version: 2

models:
  - name: stg_customers
    description: Customer source records with standardized names and values.
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: customer_status
        tests:
          - not_null

  - name: stg_orders
    description: Order headers with normalized statuses.
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null

  - name: stg_order_items
    description: Order line items with line-level revenue.
    columns:
      - name: order_item_key
        tests:
          - unique
          - not_null
      - name: line_revenue
        tests:
          - positive_values
