name: dbt_demo_session
version: 1.0.0
config-version: 2

profile: dbt_demo_session

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
docs-paths: ["docs"]

target-path: target
clean-targets:
  - target
  - dbt_packages

vars:
  high_value_customer_threshold: 1000

models:
  dbt_demo_session:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +schema: marts
      +materialized: table
      dimensions:
        +tags: ["dimensions"]
      facts:
        +tags: ["facts"]
      reporting:
        +materialized: view
        +tags: ["reporting"]

seeds:
  dbt_demo_session:
    +schema: reference
    +quote_columns: false

snapshots:
  dbt_demo_session:
    +target_schema: training_snapshots
