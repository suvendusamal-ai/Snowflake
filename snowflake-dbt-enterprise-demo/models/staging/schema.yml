version: 2

models:
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: customer_status
        data_tests:
          - accepted_values:
              values: ['ACTIVE', 'INACTIVE']
              
  - name: stg_products
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
          
  - name: stg_orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

      - name: order_status
        data_tests:
          - accepted_values:
              values: ['PENDING', 'COMPLETED', 'CANCELLED']

  - name: stg_order_items
    columns:
      - name: quantity
        data_tests:
          - not_null

      - name: net_line_amount
        data_tests:
          - not_null